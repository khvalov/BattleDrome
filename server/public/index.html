<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BattleDrome Dashboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d1117;
      color: #e6edf3;
      font-family: 'Courier New', monospace;
      min-height: 100vh;
      padding: 2rem;
    }

    header {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    header h1 {
      font-size: 1.6rem;
      letter-spacing: 0.1em;
      color: #58a6ff;
      text-transform: uppercase;
    }

    #connection-badge {
      font-size: 0.75rem;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      font-weight: bold;
      letter-spacing: 0.05em;
    }
    #connection-badge.connected { background: #1a3a1a; color: #3fb950; border: 1px solid #3fb950; }
    #connection-badge.disconnected { background: #3a1a1a; color: #f85149; border: 1px solid #f85149; }

    #no-tanks {
      color: #8b949e;
      font-size: 0.9rem;
      margin-top: 4rem;
      text-align: center;
    }

    #grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.25rem;
    }

    .tank-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 1.25rem;
      transition: border-color 0.3s;
    }
    .tank-card.online  { border-color: #3fb950; }
    .tank-card.offline { border-color: #484f58; opacity: 0.65; }

    .tank-header {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 1rem;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .online  .status-dot { background: #3fb950; box-shadow: 0 0 6px #3fb950; }
    .offline .status-dot { background: #484f58; }

    .tank-name {
      font-size: 1rem;
      font-weight: bold;
      color: #e6edf3;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .tank-status-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .online  .tank-status-label { color: #3fb950; }
    .offline .tank-status-label { color: #8b949e; }

    .tank-meta {
      font-size: 0.75rem;
      color: #8b949e;
      margin-bottom: 0.75rem;
    }

    .event-box {
      background: #0d1117;
      border: 1px solid #21262d;
      border-radius: 6px;
      padding: 0.6rem 0.75rem;
      font-size: 0.72rem;
      color: #8b949e;
      max-height: 90px;
      overflow: hidden;
      white-space: pre;
    }
    .event-box.has-event { color: #c9d1d9; }

    .pulse {
      animation: pulse 0.4s ease-out;
    }
    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(63,185,80,0.5); }
      100% { box-shadow: 0 0 0 12px rgba(63,185,80,0); }
    }
  </style>
</head>
<body>

<header>
  <h1>&#9876; BattleDrome</h1>
  <span id="connection-badge" class="disconnected">CONNECTING</span>
</header>

<div id="no-tanks">Waiting for tanks to come online&hellip;</div>
<div id="grid"></div>

<script>
  const grid = document.getElementById('grid');
  const noTanks = document.getElementById('no-tanks');
  const badge = document.getElementById('connection-badge');

  let ws;

  function connect() {
    ws = new WebSocket(`ws://${location.host}`);

    ws.onopen = () => {
      badge.textContent = 'CONNECTED';
      badge.className = 'connected';
    };

    ws.onclose = () => {
      badge.textContent = 'DISCONNECTED';
      badge.className = 'disconnected';
      setTimeout(connect, 3000);
    };

    ws.onmessage = (ev) => {
      const msg = JSON.parse(ev.data);
      if (msg.type === 'update') renderTanks(msg.tanks);
    };
  }

  function timeSince(ms) {
    const s = Math.floor((Date.now() - ms) / 1000);
    if (s < 5)  return 'just now';
    if (s < 60) return `${s}s ago`;
    return `${Math.floor(s / 60)}m ${s % 60}s ago`;
  }

  function renderTanks(tanks) {
    noTanks.style.display = tanks.length ? 'none' : 'block';

    const seen = new Set(tanks.map(t => t.id));

    // Remove cards for tanks that disappeared
    for (const card of grid.querySelectorAll('.tank-card')) {
      if (!seen.has(card.dataset.id)) card.remove();
    }

    for (const tank of tanks) {
      let card = grid.querySelector(`.tank-card[data-id="${tank.id}"]`);
      const isNew = !card;

      if (isNew) {
        card = document.createElement('div');
        card.className = 'tank-card';
        card.dataset.id = tank.id;
        card.innerHTML = `
          <div class="tank-header">
            <div class="status-dot"></div>
            <span class="tank-name">${escHtml(tank.id)}</span>
            <span class="tank-status-label"></span>
          </div>
          <div class="tank-meta"></div>
          <div class="event-box">No events yet</div>
        `;
        grid.appendChild(card);
      }

      const wasOnline = card.classList.contains('online');
      card.className = `tank-card ${tank.online ? 'online' : 'offline'}`;

      card.querySelector('.tank-status-label').textContent = tank.online ? 'ONLINE' : 'OFFLINE';
      card.querySelector('.tank-meta').textContent =
        tank.lastSeen ? `Last seen: ${timeSince(tank.lastSeen)}` : '';

      const eventBox = card.querySelector('.event-box');
      if (tank.lastEvent) {
        eventBox.textContent = JSON.stringify(tank.lastEvent, null, 2);
        eventBox.classList.add('has-event');
      }

      if (!wasOnline && tank.online) {
        card.classList.add('pulse');
        card.addEventListener('animationend', () => card.classList.remove('pulse'), { once: true });
      }
    }
  }

  // Refresh "last seen" timestamps every 5s without a server round-trip
  setInterval(() => {
    for (const card of grid.querySelectorAll('.tank-card')) {
      const meta = card.querySelector('.tank-meta');
      const lastSeenText = meta.textContent;
      if (lastSeenText) {
        // Re-render just the meta from a stored attribute
        const ts = card.dataset.lastSeen;
        if (ts) meta.textContent = `Last seen: ${timeSince(Number(ts))}`;
      }
    }
  }, 5000);

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // Patch renderTanks to also store lastSeen on the card element
  const _renderTanks = renderTanks;
  renderTanks = function(tanks) {
    _renderTanks(tanks);
    for (const tank of tanks) {
      const card = grid.querySelector(`.tank-card[data-id="${tank.id}"]`);
      if (card && tank.lastSeen) card.dataset.lastSeen = tank.lastSeen;
    }
  };

  connect();
</script>
</body>
</html>
