<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BattleDrome Dashboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d1117;
      color: #e6edf3;
      font-family: 'Courier New', monospace;
      min-height: 100vh;
      padding: 2rem;
    }

    header {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    header h1 {
      font-size: 1.6rem;
      letter-spacing: 0.1em;
      color: #58a6ff;
      text-transform: uppercase;
    }

    #connection-badge {
      font-size: 0.75rem;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      font-weight: bold;
      letter-spacing: 0.05em;
    }
    #connection-badge.connected    { background: #1a3a1a; color: #3fb950; border: 1px solid #3fb950; }
    #connection-badge.disconnected { background: #3a1a1a; color: #f85149; border: 1px solid #f85149; }

    #no-tanks {
      color: #8b949e;
      font-size: 0.9rem;
      margin-top: 4rem;
      text-align: center;
    }

    #grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.25rem;
    }

    /* ── Card ── */
    .tank-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 1.25rem;
      transition: border-color 0.3s, opacity 0.3s;
    }
    .tank-card.online  { border-color: #3fb950; }
    .tank-card.offline { border-color: #484f58; opacity: 0.6; }

    /* ── Card header ── */
    .tank-header {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 1rem;
    }

    .status-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .online  .status-dot { background: #3fb950; box-shadow: 0 0 6px #3fb950; }
    .offline .status-dot { background: #484f58; }

    .tank-name {
      font-size: 1rem;
      font-weight: bold;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .tank-status-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .online  .tank-status-label { color: #3fb950; }
    .offline .tank-status-label { color: #8b949e; }

    .tank-meta {
      font-size: 0.72rem;
      color: #8b949e;
      margin-bottom: 0.9rem;
    }

    /* ── Telemetry ── */
    .telemetry {
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
    }

    .stat-row {
      display: grid;
      grid-template-columns: 72px 1fr 36px;
      align-items: center;
      gap: 0.5rem;
    }

    .stat-label {
      font-size: 0.68rem;
      color: #8b949e;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .bar-track {
      height: 6px;
      background: #21262d;
      border-radius: 3px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.4s ease, background 0.4s ease;
    }

    /* colour per stat */
    .bar-speed     { background: #58a6ff; }
    .bar-health    { background: #3fb950; }
    .bar-ammo      { background: #e3b341; }
    .bar-ammoLevel { background: #d29922; }
    .bar-fireSpeed { background: #f78166; }

    .stat-value {
      font-size: 0.72rem;
      color: #c9d1d9;
      text-align: right;
    }

    /* immune badge */
    .immune-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.2rem;
    }

    .immune-badge {
      font-size: 0.65rem;
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-weight: bold;
    }
    .immune-on  { background: #1f3d2e; color: #3fb950; border: 1px solid #3fb950; }
    .immune-off { background: #1c1c1c; color: #484f58; border: 1px solid #30363d; }

    .no-telemetry {
      font-size: 0.72rem;
      color: #484f58;
      font-style: italic;
    }

    /* pulse on reconnect */
    .pulse { animation: pulse 0.4s ease-out; }
    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(63,185,80,0.5); }
      100% { box-shadow: 0 0 0 14px rgba(63,185,80,0); }
    }

    /* ── Telemetry log ── */
    #log-section {
      margin-top: 2.5rem;
    }

    #log-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 0.75rem;
    }

    #log-header h2 {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #8b949e;
    }

    #log-count {
      font-size: 0.7rem;
      color: #484f58;
    }

    #log-clear {
      margin-left: auto;
      background: none;
      border: 1px solid #30363d;
      color: #8b949e;
      border-radius: 4px;
      padding: 0.2rem 0.65rem;
      font-size: 0.7rem;
      cursor: pointer;
      font-family: inherit;
      letter-spacing: 0.05em;
    }
    #log-clear:hover { border-color: #8b949e; color: #e6edf3; }

    #log-list {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      max-height: 480px;
      overflow-y: auto;
    }

    .log-entry {
      background: #0d1117;
      border: 1px solid #21262d;
      border-radius: 6px;
      padding: 0.5rem 0.75rem;
      font-size: 0.68rem;
      animation: fadeIn 0.2s ease;
    }
    .log-entry.type-fire      { border-left: 3px solid #f78166; }
    .log-entry.type-telemetry { border-left: 3px solid #58a6ff; }
    .log-entry.type-system    { border-left: 3px solid #3fb950; }
    .log-entry.type-error     { border-left: 3px solid #f85149; }

    .log-meta {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 0.3rem;
      color: #484f58;
    }
    .log-meta .log-tank { color: #8b949e; }
    .log-meta .log-type { text-transform: uppercase; letter-spacing: 0.06em; }
    .log-meta .log-type.type-fire      { color: #f78166; }
    .log-meta .log-type.type-telemetry { color: #58a6ff; }
    .log-meta .log-type.type-system    { color: #3fb950; }
    .log-meta .log-type.type-error     { color: #f85149; }

    .log-json {
      color: #8b949e;
      white-space: pre;
      overflow-x: auto;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<header>
  <h1>&#9876; BattleDrome</h1>
  <span id="connection-badge" class="disconnected">CONNECTING</span>
</header>

<div id="no-tanks">Waiting for tanks to come online&hellip;</div>
<div id="grid"></div>

<div id="log-section">
  <div id="log-header">
    <h2>Telemetry Log</h2>
    <span id="log-count">0 entries</span>
    <button id="log-clear">Clear</button>
  </div>
  <div id="log-list"></div>
</div>

<script>
  const grid   = document.getElementById('grid');
  const noTanks = document.getElementById('no-tanks');
  const badge  = document.getElementById('connection-badge');

  let ws;

  function connect() {
    ws = new WebSocket(`ws://${location.host}`);
    ws.onopen  = () => { badge.textContent = 'CONNECTED';    badge.className = 'connected'; };
    ws.onclose = () => { badge.textContent = 'DISCONNECTED'; badge.className = 'disconnected'; setTimeout(connect, 3000); };
    ws.onmessage = (ev) => {
      const msg = JSON.parse(ev.data);
      if (msg.type === 'update') renderTanks(msg.tanks);
      if (msg.type === 'log')    appendLog(msg);
    };
  }

  function timeSince(ms) {
    const s = Math.floor((Date.now() - ms) / 1000);
    if (s < 5)  return 'just now';
    if (s < 60) return `${s}s ago`;
    return `${Math.floor(s / 60)}m ${s % 60}s ago`;
  }

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function barHtml(label, cssClass, value, max) {
    const pct = Math.round(Math.min(100, Math.max(0, (value / max) * 100)));
    return `
      <div class="stat-row">
        <span class="stat-label">${label}</span>
        <div class="bar-track"><div class="bar-fill ${cssClass}" style="width:${pct}%"></div></div>
        <span class="stat-value">${value}</span>
      </div>`;
  }

  function telemetryHtml(t) {
    if (!t) return '<div class="no-telemetry">No telemetry yet</div>';
    const speed     = t.speed     ?? '—';
    const health    = t.health    ?? '—';
    const ammo      = t.ammo      ?? '—';
    const ammoLevel = t.ammoLevel ?? '—';
    const fireSpeed = t.fireSpeed ?? '—';
    const immunable = t.immunable ?? false;

    const bars = `
      ${barHtml('Speed',      'bar-speed',     speed     === '—' ? 0 : speed,     255)}
      ${barHtml('Health',     'bar-health',    health    === '—' ? 0 : health,    100)}
      ${barHtml('Ammo',       'bar-ammo',      ammo      === '—' ? 0 : ammo,      100)}
      ${barHtml('Ammo Lv',    'bar-ammoLevel', ammoLevel === '—' ? 0 : ammoLevel, 10)}
      ${barHtml('Fire Spd',   'bar-fireSpeed', fireSpeed === '—' ? 0 : fireSpeed, 10)}
    `;
    const immuneBadge = `
      <div class="immune-row">
        <span class="stat-label">Immune</span>
        <span class="immune-badge ${immunable ? 'immune-on' : 'immune-off'}">${immunable ? 'YES' : 'NO'}</span>
      </div>`;
    return bars + immuneBadge;
  }

  function renderTanks(tanks) {
    noTanks.style.display = tanks.length ? 'none' : 'block';

    const seen = new Set(tanks.map(t => t.id));
    for (const card of grid.querySelectorAll('.tank-card')) {
      if (!seen.has(card.dataset.id)) card.remove();
    }

    for (const tank of tanks) {
      let card = grid.querySelector(`.tank-card[data-id="${escHtml(tank.id)}"]`);
      const wasOnline = card && card.classList.contains('online');

      if (!card) {
        card = document.createElement('div');
        card.className = 'tank-card';
        card.dataset.id = tank.id;
        grid.appendChild(card);
      }

      card.className = `tank-card ${tank.online ? 'online' : 'offline'}`;
      if (tank.lastSeen) card.dataset.lastSeen = tank.lastSeen;

      card.innerHTML = `
        <div class="tank-header">
          <div class="status-dot"></div>
          <span class="tank-name">${escHtml(tank.id)}</span>
          <span class="tank-status-label">${tank.online ? 'ONLINE' : 'OFFLINE'}</span>
        </div>
        <div class="tank-meta">${tank.lastSeen ? `Last seen: ${timeSince(tank.lastSeen)}` : ''}</div>
        <div class="telemetry">${telemetryHtml(tank.telemetry)}</div>
      `;

      if (!wasOnline && tank.online) {
        card.classList.add('pulse');
        card.addEventListener('animationend', () => card.classList.remove('pulse'), { once: true });
      }
    }
  }

  // Refresh "last seen" without a server round-trip
  setInterval(() => {
    for (const card of grid.querySelectorAll('.tank-card[data-last-seen]')) {
      const meta = card.querySelector('.tank-meta');
      if (meta) meta.textContent = `Last seen: ${timeSince(Number(card.dataset.lastSeen))}`;
    }
  }, 5000);

  // ── Telemetry log ────────────────────────────────────────────────────────────
  const logList  = document.getElementById('log-list');
  const logCount = document.getElementById('log-count');
  const logClear = document.getElementById('log-clear');
  const MAX_LOG  = 100;

  logClear.addEventListener('click', () => {
    logList.innerHTML = '';
    logCount.textContent = '0 entries';
  });

  function appendLog({ tankId, receivedAt, payload }) {
    const eventType = payload?.event?.type || 'unknown';
    const ts = new Date(receivedAt).toISOString().replace('T', ' ').slice(0, -1) + 'Z';

    const entry = document.createElement('div');
    entry.className = `log-entry type-${eventType}`;
    entry.innerHTML = `
      <div class="log-meta">
        <span class="log-tank">${escHtml(tankId)}</span>
        <span class="log-type type-${eventType}">${escHtml(eventType)}</span>
        <span>${escHtml(ts)}</span>
      </div>
      <pre class="log-json">${escHtml(JSON.stringify(payload, null, 2))}</pre>
    `;

    logList.insertBefore(entry, logList.firstChild);

    // Trim to MAX_LOG entries
    while (logList.children.length > MAX_LOG) {
      logList.removeChild(logList.lastChild);
    }

    const n = logList.children.length;
    logCount.textContent = `${n} entr${n === 1 ? 'y' : 'ies'}`;
  }

  connect();
</script>
</body>
</html>
